name: cloudformation-cicd

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Add cfn-lint problem matcher
        run: echo "::add-matcher::.github/cfn-lint.json"

      - name: Run cfn-lint
        run: |
          files="cloudformation/ecr.yaml cloudformation/cloudwatch.yaml cloudformation/role.yaml cloudformation/ecs.yaml cloudformation/secrets-manager.yaml"
          for file in $files; do
            cfn-lint "$file" -f parseable
          done

  cfn-nag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'

      - name: Install cfn-nag
        run: gem install cfn-nag

      - name: Run cfn-nag
        run: |
          files="cloudformation/ecr.yaml cloudformation/cloudwatch.yaml cloudformation/role.yaml cloudformation/ecs.yaml cloudformation/secrets-manager.yaml"
          for file in $files; do
            cfn_nag "$file"
          done

  deploy-log_group:
    needs: [cfn-lint, cfn-nag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.LOG_GROUP_DEPLOYMENT_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Deploy Log Group
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/cloudwatch.yaml \
            --stack-name Message-API-Log-Group
  
  deploy-ecr:
    needs: [cfn-lint, cfn-nag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECR_REPOSITORY_DEPLOYMENT_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Deploy ECR
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/ecr.yaml \
            --stack-name Message-API-ECR \

