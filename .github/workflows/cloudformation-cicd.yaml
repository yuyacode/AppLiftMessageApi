  deploy-ecs:
    needs: [build_and_push_image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECS_DEPLOYMENT_ROLE_ARN }}  # 後でこのロールを作成する
          aws-region: ap-northeast-1

      - name: Deploy ECS Service and Task
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/ecs.yaml \
            --stack-name Message-API-ECS \
            --parameter-overrides \
              AWSAccountID=853412075128 \
              ECRRepositoryName=${{ secrets.MESSAGE_API_ECR_REPOSITORY_NAME }} \
              ImageTag=${{ needs.build_and_push_image.outputs.image_tag }} \
              NetworkStackName=Network-Stack \
              SecretsManagerStackName=Message-API-Secrets-Manager \
              DBStackName=DB \
              ExecutionRoleStackName=ECS-Task-Execution-Role \
              RoleStackName=Message-API-Role \
              ALBStackName=ALB \
              SGStackName=Security-Group

  deploy-role:
    needs: [cfn-lint, cfn-nag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.IAM_ROLE_STACK_DEPLOYMENT_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Deploy Role
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/role.yaml \
            --stack-name Message-API-Role \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM