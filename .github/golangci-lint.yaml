run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  build-tags: []
  skip-dirs:
    - vendor

output:
  formats:
    - colored-line-number

linters-settings:
  goimports:
    local-prefixes: "github.com/yuyacode/AppLiftMessageApi"
  gocognit:
    min-complexity: 15
  gocyclo:
    min-complexity: 15

linters:
  disable-all: true
  enable:
    - bodyclose
    - deadcode
    - errcheck
    - gocognit
    - gocritic
    - gocyclo
    - gofmt
    - goimports
    - govet
    - ineffassign
    - staticcheck
    - whitespace