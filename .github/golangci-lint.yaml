linters-settings:
  goimports:
    local-prefixes: "github.com/yuyacode/AppLiftMessageApi"

linters:
  disable-all: true
  enable:
    - bodyclose
    - deadcode
    - errcheck
    - gocognit
    - gocritic
    - gocyclo
    - gofmt
    - goimports
    - govet
    - ineffassign
    - staticcheck
    - whitespace