version: "2"

issues:
  exit-code: 1

run:
  tests: true
  build-tags: []
  skip-dirs:
    - vendor

formatters:
  enable:
    - goimports
    - gofmt
  settings:
    goimports:
      local-prefixes:
        - github.com/yuyacode/AppLiftMessageApi

linters:
  enable:
    - bodyclose
    - errcheck
    - gocognit
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - staticcheck
    - whitespace
  settings:
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 15
