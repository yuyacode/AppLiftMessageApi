AWSTemplateFormatVersion: '2010-09-09'
Description: Defines the ECS Task Definition and Service for the AppLiftMessageAPI.

Parameters:
  AWSAccountID:
    Type: String
    AllowedPattern: '^\d{12}$'
  ECRRepositoryName:
    Type: String
  ImageTag:
    Type: String
  NetworkStackName:
    Type: String
  SecretsManagerStackName:
    Type: String
  DBStackName:
    Type: String
  ExecutionRoleStackName:
    Type: String
  RoleStackName:
    Type: String
  ECSClusterStackName:
    Type: String
  ALBStackName:
    Type: String
  SGStackName:
    Type: String

Resources:
  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: 256
      Memory: 512
      ExecutionRoleArn: !ImportValue
        Fn::Sub: "${ExecutionRoleStackName}-Arn"
      Family: "AppLiftMessageAPI"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      TaskRoleArn: !ImportValue
        Fn::Sub: "${RoleStackName}-ECSTaskRoleArn"
      ContainerDefinitions:
        - Name: message-api-container
          Image: !Sub "${AWSAccountID}.dkr.ecr.${AWS::Region}.amazonaws.com/${ECRRepositoryName}:${ImageTag}"
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !ImportValue AppLiftMessageAPILogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs/app_lift
          Environment:
            - Name: ENV
              Value: production
            - Name: PORT
              Value: 8080
            - Name: DB_COMPANY
              Value: company
            - Name: DB_STUDENT
              Value: student
            - Name: DB_COMMON
              Value: common
            # - Name: ALLOWED_ORIGIN
            #   Value:   # 後で設定する
          Secrets:
            - Name: DB_HOST
              ValueFrom: !Sub
                - "${SecretArn}:host::"
                - { SecretArn: !ImportValue "${DBStackName}-MasterSecretARN" }
            - Name: DB_PORT
              ValueFrom: !Sub
                - "${SecretArn}:port::"
                - { SecretArn: !ImportValue "${DBStackName}-MasterSecretARN" }
            - Name: DB_USERNAME
              ValueFrom: !Sub
                - "${SecretArn}:username::"
                - { SecretArn: !ImportValue "${DBStackName}-MasterSecretARN" }
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - "${SecretArn}:password::"
                - { SecretArn: !ImportValue "${DBStackName}-MasterSecretARN" }
            - Name: ACCESS_TOKEN_SECRET_KEY
              ValueFrom: !ImportValue
                Fn::Sub: "${SecretsManagerStackName}-AccessTokenSecretKeyArn:key"
            - Name: REFRESH_TOKEN_SECRET_KEY
              ValueFrom: !ImportValue
                Fn::Sub: "${SecretsManagerStackName}-RefreshTokenSecretKeyArn:key"
  ECSService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !ImportValue
        Fn::Sub: "${ECSClusterStackName}-Arn"
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      DesiredCount: 1
      EnableECSManagedTags: true
      EnableExecuteCommand: true
      HealthCheckGracePeriodSeconds: 60
      LaunchType: FARGATE
      LoadBalancers:
        - ContainerName: message-api-container
          ContainerPort: 8080
          TargetGroupArn: !ImportValue
            Fn::Sub: "${ALBStackName}-MessageApiTargetGroupArn"
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnet1aId"
            - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnet1cId"
          SecurityGroups:
            - Fn::ImportValue: !Sub "${SGStackName}-MessageApiSGId"
          AssignPublicIp: DISABLED
      PropagateTags: SERVICE
      SchedulingStrategy: REPLICA
      TaskDefinition: !Ref ECSTaskDefinition

Outputs:
  ECSServiceName:
    Description: The name of the ECS Service.
    Value: !Ref ECSService
  ECSServiceArn:
    Description: The ARN of the ECS Service.
    Value: !GetAtt ECSService.ServiceArn
  ECSTaskDefinitionArn:
    Description: The ARN of the ECS Task Definition.
    Value: !Ref ECSTaskDefinition
