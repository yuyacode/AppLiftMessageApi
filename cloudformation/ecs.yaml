AWSTemplateFormatVersion: '2010-09-09'
Description: Defines the ECS Task Definition and Service for the AppLiftMessageAPI.

Parameters:
  AWSAccountID:
    Type: String
    AllowedPattern: '^\d{12}$'
  ECRRepositoryName:
    Type: String
  ImageTag:
    Type: String
  NetworkStackName:
    Type: String
  SecretsManagerStackName:
    Type: String
  DBStackName:
    Type: String
  ExecutionRoleStackName:
    Type: String
  RoleStackName:
    Type: String
  ECSClusterStackName:
    Type: String
  ALBStackName:
    Type: String
  SGStackName:
    Type: String
  MaxTaskCount:
    Type: String
  MinTaskCount:
    Type: String

Resources:
  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: 256
      Memory: 512
      ExecutionRoleArn: !ImportValue
        Fn::Sub: "${ExecutionRoleStackName}-Arn"
      Family: "AppLiftMessageAPI"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      TaskRoleArn: !ImportValue
        Fn::Sub: "${RoleStackName}-ECSTaskRoleArn"
      ContainerDefinitions:
        - Name: message-api-container
          Image: !Sub "${AWSAccountID}.dkr.ecr.${AWS::Region}.amazonaws.com/${ECRRepositoryName}:${ImageTag}"
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          HealthCheck:
            Command: ["CMD-SHELL", "exit 0"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 0
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !ImportValue AppLiftMessageAPILogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs/app_lift
          Environment:
            - Name: ENV
              Value: production
            - Name: PORT
              Value: 8080
            - Name: DB_COMPANY
              Value: company
            - Name: DB_STUDENT
              Value: student
            - Name: DB_COMMON
              Value: common
            - Name: DB_MESSAGE_SCHEDULER
              Value: message_scheduler
            # - Name: ALLOWED_ORIGIN
            #   Value: set_later
          Secrets:
            - Name: DB_HOST
              ValueFrom: !Sub
                - "${ImportedArn}:host::"
                - ImportedArn: !ImportValue
                    Fn::Sub:
                      - "${DBStackName}-MasterSecretARN"
                      - { DBStackName: !Ref DBStackName }
            - Name: DB_PORT
              ValueFrom: !Sub
                - "${ImportedArn}:port::"
                - ImportedArn: !ImportValue
                    Fn::Sub:
                      - "${DBStackName}-MasterSecretARN"
                      - { DBStackName: !Ref DBStackName }
            - Name: DB_USERNAME
              ValueFrom: !Sub
                - "${ImportedArn}:username::"
                - ImportedArn: !ImportValue
                    Fn::Sub:
                      - "${DBStackName}-MasterSecretARN"
                      - { DBStackName: !Ref DBStackName }
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - "${ImportedArn}:password::"
                - ImportedArn: !ImportValue
                    Fn::Sub:
                      - "${DBStackName}-MasterSecretARN"
                      - { DBStackName: !Ref DBStackName }
            - Name: ACCESS_TOKEN_SECRET_KEY
              ValueFrom: !ImportValue
                Fn::Sub: "${SecretsManagerStackName}-AccessTokenSecretKeyArn"
            - Name: REFRESH_TOKEN_SECRET_KEY
              ValueFrom: !ImportValue
                Fn::Sub: "${SecretsManagerStackName}-RefreshTokenSecretKeyArn"
  ECSService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !ImportValue
        Fn::Sub: "${ECSClusterStackName}-Arn"
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      DesiredCount: 1
      EnableECSManagedTags: true
      EnableExecuteCommand: true
      HealthCheckGracePeriodSeconds: 120
      LaunchType: FARGATE
      LoadBalancers:
        - ContainerName: message-api-container
          ContainerPort: 8080
          TargetGroupArn: !ImportValue
            Fn::Sub: "${ALBStackName}-MessageApiTargetGroupArn"
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnet1aId"
            - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnet1cId"
          SecurityGroups:
            - Fn::ImportValue: !Sub "${SGStackName}-MessageApiSGId"
          AssignPublicIp: DISABLED
      PropagateTags: SERVICE
      SchedulingStrategy: REPLICA
      TaskDefinition: !Ref ECSTaskDefinition
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: !Ref MaxTaskCount
      MinCapacity: !Ref MinTaskCount
      ResourceId: !Join
        - /
        - - service
          - !ImportValue
              Fn::Sub: "${ECSClusterStackName}-Name"
          - !GetAtt ECSService.Name
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
  ScalingPolicyCPU:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: target-tracking-cpu
      PolicyType: TargetTrackingScaling
      ScalableDimension: ecs:service:DesiredCount
      ScalingTargetId: !Ref ScalableTarget
      ServiceNamespace: ecs
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleOutCooldown: 60
        ScaleInCooldown: 180
  ScalingPolicyALB:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: target-tracking-alb-rpm
      PolicyType: TargetTrackingScaling
      ScalableDimension: ecs:service:DesiredCount
      ScalingTargetId: !Ref ScalableTarget
      ServiceNamespace: ecs
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 100
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Join
            - '/'
            - - !ImportValue
                Fn::Sub: "${ALBStackName}-InternalALBFullName"
              - !ImportValue
                Fn::Sub: "${ALBStackName}-MessageApiTargetGroupFullName"
        ScaleOutCooldown: 30
        ScaleInCooldown: 180

Outputs:
  ECSServiceName:
    Description: The name of the ECS Service.
    Value: !Ref ECSService
  ECSServiceArn:
    Description: The ARN of the ECS Service.
    Value: !GetAtt ECSService.ServiceArn
  ECSTaskDefinitionArn:
    Description: The ARN of the ECS Task Definition.
    Value: !Ref ECSTaskDefinition
