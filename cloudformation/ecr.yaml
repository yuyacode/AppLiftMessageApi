AWSTemplateFormatVersion: '2010-09-09'
Description: Defines the ECR repository for AppLiftMessageApi.

Resources:
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 30 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 30
                },
                "action": {
                  "type": "expire"
                }
              },
              {
                "rulePriority": 2,
                "description": "Keep only the last 10 tagged images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPatternList": ["*"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

Outputs:
  ECRRepositoryArn:
    Description: The ARN of the ECR repository for AppLiftMessageApi.
    Value: !GetAtt ECRRepository.Arn
    Export:
      Name: AppLiftMessageApiECRRepositoryArn

  ECRRepositoryUri:
    Description: URI of the ECR repository for AppLiftMessageApi.
    Value: !GetAtt ECRRepository.RepositoryUri
    Export:
      Name: AppLiftMessageApiECRRepositoryUri